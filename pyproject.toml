[project]
name = "synthetic-industrial-products"
version = "0.1.0"
description = "Generated industrial-supply catalog records, and dimensioned technical drawings rendered from them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
sip-render = "synthetic_industrial_products.cli:main"
sip-generate = "synthetic_industrial_products.catalog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two packages ship from this repo. ``synthetic_industrial_products`` is the
# generator; ``prism_synthetic_industrial`` is the PRISM customization, whose
# directory name is fixed by PRISM's loader -- it globs
# ``src/prism_*/data/customization.yaml`` and requires exactly one match.
packages = ["src/synthetic_industrial_products", "src/prism_synthetic_industrial"]

# The customization is nothing but data files, and a wheel that drops them
# installs a package PRISM cannot read.
[tool.hatch.build.targets.wheel.force-include]
"src/prism_synthetic_industrial/data" = "prism_synthetic_industrial/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The mutation table holds verbatim fragments of source that must match the
# files they patch byte for byte. Wrapping them to satisfy the line limit
# would stop them matching, and the harness would report "mutation did not
# apply" for rules it is supposed to be testing.
"scripts/mutation_check.py" = ["E501"]
