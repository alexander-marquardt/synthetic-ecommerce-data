  # Width Across Flats -- a discrete standard set: 144 distinct values over 1762 documents is 0.08 per document, below the 0.50 continuity threshold, so the values repeat and are offered as a list rather than an interval
  #   present on 1762 documents across 2 product type(s); 144 distinct values
  - name: width_across_flats
    type: terms
    source: facets.width_across_flats

# The phrase boost goes on the title: an exact phrase in a product
# title is a much stronger signal than the same phrase somewhere in
# the concatenated attribute text.
phrase_boost_field: title
