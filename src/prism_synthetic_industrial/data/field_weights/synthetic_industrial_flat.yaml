  # Thread Size -- 35 distinct values reads as an identifier, not a facet (cap 25)
  #   present on 1607 documents across 2 product type(s); 35 distinct values
  - name: thread_size
    type: terms
    source: facets.thread_size
    facet: false
  # Thread Type -- 4 distinct values
  #   present on 2471 documents across 7 product type(s); 4 distinct values
  - name: thread_type
    type: terms
    source: facets.thread_type
  # Tip Style -- 2 distinct values
  #   present on 1326 documents across 2 product type(s); 2 distinct values
  - name: tip_style
    type: terms
    source: facets.tip_style
  # Type -- 17 distinct values
  #   present on 6990 documents across 11 product type(s); 17 distinct values
  - name: type
    type: terms
    source: facets.type
  # Width -- a discrete standard set: 61 distinct values over 1245 documents is 0.05 per document, below the 0.50 continuity threshold, so the values repeat and are offered as a list rather than an interval
  #   present on 1245 documents across 1 product type(s); 61 distinct values
  - name: width
    type: terms
    source: facets.width
  # Width Across Flats -- a discrete standard set: 144 distinct values over 1718 documents is 0.08 per document, below the 0.50 continuity threshold, so the values repeat and are offered as a list rather than an interval
  #   present on 1718 documents across 2 product type(s); 144 distinct values
  - name: width_across_flats
    type: terms
    source: facets.width_across_flats

# The phrase boost goes on the title: an exact phrase in a product
# title is a much stronger signal than the same phrase somewhere in
# the concatenated attribute text.
phrase_boost_field: title
