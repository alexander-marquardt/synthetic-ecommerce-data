# Hooks for this repository, mirroring the sibling customization's
# (elastic/prism-industrial-products) where they apply. Install all three hook types:
#
#     pre-commit install -t pre-commit -t commit-msg -t pre-push
#
# ``default_install_hook_types`` makes a plain ``pre-commit install`` do that.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Every hook below runs at the COMMIT stage only. The push stage runs ONE hook,
# ``prepush-gate`` at the end of this file, which runs the cheap rows of CI
# (lint, commit messages, file size, the scans over tracked files); running the
# whitespace and lint hooks at the push stage as well would be the same work twice.
# A hook's own manifest lists ``pre-push`` among its stages and outranks
# ``default_stages``, so each hook from a remote repository names ``stages`` itself.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The golden catalog is written byte-for-byte by ``ecom-generate build``
      # and compared by sha256; a byte a hook added would red the golden test.
      # vendor/ is core's code byte for byte, pinned by git blob id
      # (vendor/prism/PIN.txt): a fixed byte would break the pin.
      - id: end-of-file-fixer
        exclude: ^(golden-catalog|vendor)/
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: ^(golden-catalog|vendor)/
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # ``ruff check`` only, as CI runs it. ``ruff format`` is not enforced in
      # this repository yet (see the note in .github/workflows/ci.yaml), and a
      # format hook would reformat every file a change touches.
      - id: ruff-check
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI or bot attribution in the commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
      # The file-size cap at commit time (elastic/prism#11683), core's hook
      # run on this tree: it names each File-Size-Exception line the PR body
      # will need, and prints nothing when nothing grew. It refuses only when
      # PRISM_PR_BODY_FILE names a body that lacks a line, or an agent commit
      # (AGENT_TMP set) has no body. docs/file-size-budget.md.
      - id: file-size-warning
        name: file-size cap at commit
        entry: python3 scripts/file_size_gate.py --base origin/main --warn-at-commit
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]
      # scripts/prepush.py: this repository's cheap CI jobs on the branch, before
      # review (elastic/prism#11677). Its docstring and docs/pre-push-gate.md say
      # what it runs and when it blocks (only a branch with an open pull request,
      # or main). A deliberate skip is ``SKIP=prepush-gate git push``.
      - id: prepush-gate
        name: pre-push gate (see verdict below)
        entry: bash scripts/prepush.sh --hook
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        verbose: true
        stages: [pre-push]
