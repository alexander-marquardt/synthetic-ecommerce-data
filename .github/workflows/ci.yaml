name: CI

# This repository had no CI at all, which is how a regeneration came to mint
# 500 new image ids, commit them, and ship a catalog whose drawings were never
# published -- 4,680 of 4,689 products rendering a broken image. The README
# already told a contributor that "the CI red tells you which one you forgot".
# There was no CI to go red.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_merge_pr.py builds a throwaway origin from HEAD, and a
          # fetch from a shallow checkout would make that origin shallow too.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `ruff check` only. `ruff format --check .` reds on 12 files that were
      # already in the tree before this workflow existed; wiring it in here
      # would mean reformatting them inside a change about published images,
      # so it is left for its own commit rather than quietly dropped -- the
      # gap is real and this comment is where it is recorded.
      # --locked everywhere: a uv.lock that no longer matches pyproject.toml
      # is refused, not silently re-locked for this run only.
      - name: Lint
        run: uv run --locked ruff check .
      # The golden comparison lives in here: tests/test_catalog_golden.py
      # rebuilds the catalog and compares every committed file by sha256, so a
      # generator change landed without its regeneration is red.
      - name: Tests
        run: uv run --locked pytest

  main-merged-tree:
    # This repository has no branch protection (the plan answers 403), so a
    # pull request can merge on a green computed against an older main, and
    # two type PRs that merge without a textual conflict can still leave the
    # committed catalog's totals or the field-weights YAML wrong.
    # scripts/merge_pr.sh runs these checks on the merged tree BEFORE merging;
    # this job runs the same list on main after every push, on its own so that
    # a merge that bypassed the script is red within minutes, not after the
    # whole suite.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Drift, golden and seam tests on main (scripts/merge_pr.sh --print-checks)
        run: |
          mapfile -t checks < <(scripts/merge_pr.sh --print-checks)
          [ "${#checks[@]}" -gt 0 ]
          uv run --locked pytest -q "${checks[@]}"

  commit-messages:
    # The commit-msg hook's rule, enforced where a clone that never ran
    # ``pre-commit install`` cannot skip it: every commit a pull request adds
    # is checked with scripts/check_commit_msg.py (the vendored core
    # AI-attribution family plus this repository's additions).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No AI or bot attribution in the PR's commit messages
        run: >-
          python3 scripts/check_commit_msg.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  file-size:
    # The file-size budget (elastic/prism#11683; docs/file-size-budget.md): a
    # file over the cap in scripts/file_size_cap.txt may not grow unless the
    # PR body carries ``File-Size-Exception: `<path>` - <reason>``. The body
    # is read only when something grew: the first run passes, or exits 4 for
    # a growth a body line could clear. merge_pr.sh --local-ci runs this job
    # with the base set to current main and gh signed in, so the body is the
    # PR's as it is at merge time. On GitHub the body is not readable here
    # (the local runner takes no token expression), so a declared growth is
    # judged by --local-ci.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads each over-cap file's size at the merge base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No file over the size cap grew without its File-Size-Exception line
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          status=0
          python3 scripts/file_size_gate.py --base "$base" --no-body-is-advisory || status=$?
          [ "$status" -eq 4 ] || exit "$status"
          body="$(mktemp)"
          gh pr view "${GITHUB_HEAD_REF:-$(git rev-parse --abbrev-ref HEAD)}" \
            --json body --jq .body > "$body"
          python3 scripts/file_size_gate.py --base "$base" --pr-body-file "$body"

  customer-name-check:
    # NO CUSTOMER NAME COMES BACK (#393, the generator half of
    # elastic/prism-industrial-products#88). Nothing but a reviewer's grep kept
    # a customer-derived token out of this repository, and a reviewer's grep
    # once called a surviving lockfile entry a false positive. The script
    # scans every tracked or unignored file (content and path), the commit
    # messages of the PR's range and the PR's live title and body, for the
    # names in elastic/prism's CUSTOMER_NAME_SPECS, which is vendored here
    # (vendor/prism/PIN.txt), so there is one list. docs/customer-name-check.md.
    #
    # The PR is named by its head branch, as the file-size job does: the local
    # run (scripts/merge_pr.sh --local-ci) takes only the base and head shas
    # from the event. GH_TOKEN is the job's own read-only token here; the
    # local run exports it empty, so the signed-in gh answers.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No customer name in the tree, the commit messages or the PR title and body
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check_customer_names.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          --pr "${GITHUB_HEAD_REF:-$(git rev-parse --abbrev-ref HEAD)}"

  # The published-assets job is gone with the asset host it checked: the
  # drawings are rebuilt from the committed catalog into a pinned bundle
  # (ecom-generate images), never hosted from here, and
  # tests/test_sku_drawings.py proves every rebuilt drawing matches the
  # sha256 the committed images.jsonl records. Whether the PINNED bundle is
  # published is checked where it is pinned, in the customization repo.
