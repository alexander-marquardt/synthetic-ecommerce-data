name: Release

# A merged decoy or product reached the catalogue only by hand, and the generator had no
# releases (gen#536). A `v*` tag builds the industrial large build and the retail ceiling, composes
# them into the ONE catalog asset (`ecom-generate compose`, gen#125), builds the ONE image bundle of
# that catalog (both halves' drawings, a file per SKU: gen#706), uploads the catalog and its
# provenance to the tag's release and the image bundle to its own release, tagged
# `images-<count>-<YYYYMMDD>` (gen#804), each with its `.content-sha256`, and opens the pin-bump
# pull request in the catalogue repository (scripts/open_pin_bump_pr.py). A manual run (workflow_dispatch) builds
# the same assets and prints the pin-bump body, and uploads and opens nothing: that is the dry
# run, and it works on a fork. This file is not a pull-request check: scripts/local_ci_jobs.py
# (NOT_A_CHECK) does not run it in `merge_pr.sh --local-ci`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the dry run names in the pin-bump body"
        required: false
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name != 'push' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the retail ceiling
        run: |
          mkdir -p build/release/retail
          uv run --locked python -m synthetic_ecommerce_data.domains.retail.scale --skus "${RELEASE_SKUS:-ceiling}" \
            --out build/release/retail/nested.jsonl --flat build/release/retail/flat.jsonl \
            --report build/release/report.json
      - name: Build the industrial catalog
        run: |
          uv run --locked ecom-generate build --lines "${RELEASE_INDUSTRIAL_LINES:-39000}" \
            --out build/release/industrial
      # A value only a larger build draws stopped `ecom-generate build --lines 4000` part-way while
      # the default build passed (gen#949). Each size below the release size is built and every
      # file it must write is checked; the release size is the industrial build above, checked
      # here rather than built twice. CI keeps the per-material test; this sweep is too slow for it.
      - name: Sweep the industrial build sizes
        run: |
          check() {
            for f in nested.jsonl flat.jsonl images.jsonl stats.json; do
              test -s "$1/$f" || { echo "::error::ecom-generate build into $1 wrote no $f"; return 1; }
            done
            echo "$1: every file written"
          }
          for lines in ${RELEASE_SWEEP_LINES:-2600 4000 10000}; do
            uv run --locked ecom-generate build --lines "$lines" --out "build/sweep/$lines"
            check "build/sweep/$lines"
          done
          check build/release/industrial
      - name: Compose the one catalog
        run: |
          uv run --locked ecom-generate compose --domain industrial=build/release/industrial \
            --domain retail=build/release/retail --out build/release/catalog
          gzip -n -9 -c build/release/catalog/catalog.ndjson > build/release/catalog.ndjson.gz
          echo "$(sha256sum build/release/catalog/catalog.ndjson | cut -d' ' -f1)  $(wc -l < build/release/catalog/catalog.ndjson)" > build/release/catalog.ndjson.gz.content-sha256
      - name: Build the image bundle
        run: |
          uv run --locked python -m synthetic_ecommerce_data.domains.retail.image_release --skus "${RELEASE_SKUS:-ceiling}" \
            --industrial-catalog build/release/industrial \
            --out build/release/images --archive build/release/images.tar.gz
      - name: The pin-bump pull request body (printed on a dry run, opened otherwise)
        env:
          PIN_BUMP_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sidecar=build/release/images.tar.gz.content-sha256
          IMAGES_TAG="images-$(awk '{print $2}' "$sidecar")-$(date -u +%Y%m%d)"
          flags=(--tag "$TAG" --images-tag "$IMAGES_TAG" --catalog build/release/catalog/catalog.ndjson
                 --images-sidecar "$sidecar")
          python3 scripts/open_pin_bump_pr.py "${flags[@]}" --dry-run | tee build/release/pin-bump-body.txt
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "Generator release $TAG." \
            build/release/catalog.ndjson.gz build/release/catalog.ndjson.gz.content-sha256 \
            build/release/catalog/provenance.json
          # A second tag the same day with the same count reuses the images release only when it
          # holds the same drawings; another archive under that name fails here.
          if gh release view "$IMAGES_TAG" > /dev/null 2>&1; then
            gh release download "$IMAGES_TAG" -p images.tar.gz.content-sha256 -O - | cmp - "$sidecar"
          else
            gh release create "$IMAGES_TAG" --target "$GITHUB_SHA" --title "$IMAGES_TAG" \
              --notes "Every drawing, industrial and retail, a file per SKU (generator $TAG)." \
              build/release/images.tar.gz build/release/images.tar.gz.content-sha256 \
              build/release/images.tar.gz.sha256 build/release/drawings.jsonl.gz
          fi
          python3 scripts/open_pin_bump_pr.py "${flags[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            build/release/*.content-sha256
            build/release/*.sha256
            build/release/pin-bump-body.txt
            build/release/report.json
            build/release/catalog/provenance.json
            build/release/catalog.ndjson.gz
            build/release/images.tar.gz
            build/release/drawings.jsonl.gz
          if-no-files-found: error
