---
# The vulnerability gate of elastic/prism, as a standalone copy (elastic/prism#16291).
#
# GENERATED by `scripts/sister_vuln_gate.py write` in elastic/prism: do not edit it here.
# A reusable workflow in a private repository is callable only inside its own organisation,
# so this repository holds the gate's scripts itself, under `.github/vuln-gate/`, pinned by
# `.github/vuln-gate/PIN.json`. The pin check runs right after the checkout and refuses to go on
# when a file there no longer matches its pin. To update the copy, run
# `scripts/sister_vuln_gate.py write <this repository> --dir <a checkout of it>` in
# elastic/prism and commit the result.
#
# Its job is the `vuln-gate` job of elastic/prism's `.github/workflows/reusable-vuln-gate.yaml`, with the
# steps that reach elastic/prism dropped, so the two cannot differ. It fails on a high,
# critical or unknown-severity advisory that no live entry of this repository's own
# `.github/vuln-allowlist.json` covers, and on an entry past its expiry or whose issue
# has closed: elastic/prism's contributing/vulnerability-gate.md.
name: vuln-gate
'on':
  pull_request: null
  merge_group: null
  push:
    branches:
    - main
permissions:
  contents: read
env:
  GIT_HTTP_LOW_SPEED_LIMIT: 1
  GIT_HTTP_LOW_SPEED_TIME: 20
  PIP_AUDIT_VERSION: 2.10.1
jobs:
  vuln-gate:
    name: vuln-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
    - name: Check out the caller's repository
      timeout-minutes: 3
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Check the vendored files against their pin
      timeout-minutes: 1
      run: python3 .github/vuln-gate/verify_pin.py
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: latest
        enable-cache: false
    - name: Install pip-audit
      timeout-minutes: 7
      run: bash $GITHUB_WORKSPACE/.github/vuln-gate/.github/scripts/retry.sh --timeout 120 uv tool install "pip-audit==$PIP_AUDIT_VERSION"
    - name: Run pip-audit on each locked Python set
      timeout-minutes: 15
      run: |
        set -euo pipefail
        : > "$RUNNER_TEMP/pip-args"
        n=0
        for lock in $(git ls-files '*uv.lock'); do
          n=$((n + 1))
          req="$RUNNER_TEMP/requirements-$n.txt"
          out="$RUNNER_TEMP/pip-audit-$n.json"
          uv export --frozen --directory "$(dirname "$lock")" \
            --format requirements-txt --all-groups \
            --no-emit-workspace --no-emit-project -o "$req"
          bash $GITHUB_WORKSPACE/.github/vuln-gate/.github/scripts/retry.sh --timeout 120 python3 .github/vuln-gate/.github/scripts/vuln_gate.py pip-audit \
            --out "$out" -- \
            "$(uv tool dir --bin)/pip-audit" -r "$req" \
            --disable-pip --require-hashes --progress-spinner off
          echo "--pip-audit=$out" >> "$RUNNER_TEMP/pip-args"
        done
    - name: Fetch the npm advisories of each lockfile
      run: |
        set -euo pipefail
        : > "$RUNNER_TEMP/npm-args"
        for lock in $(git ls-files '*package-lock.json'); do
          ws=$(dirname "$lock")
          out="$RUNNER_TEMP/npm-$(echo "$ws" | tr '/' '_').json"
          python3 .github/vuln-gate/.github/scripts/npm_registry_advisories.py "$lock" --out "$out"
          echo "--npm=$ws=$out" >> "$RUNNER_TEMP/npm-args"
        done
    - name: Judge against the caller's allowlist
      env:
        GH_TOKEN: ${{ github.token }}
        ALLOWLIST: .github/vuln-allowlist.json
      run: |
        mapfile -t report_args < <(cat "$RUNNER_TEMP/pip-args" "$RUNNER_TEMP/npm-args")
        python3 .github/vuln-gate/.github/scripts/vuln_gate.py judge \
          --allowlist "$ALLOWLIST" \
          "${report_args[@]}" \
          --summary "$GITHUB_STEP_SUMMARY"
